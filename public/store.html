<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtlantisMC | Store</title>
    
    <link rel="stylesheet" href="style.css"> 
    <link rel="icon" href="nav-logo.png" type="image/png">

    <style>
        /* Smooth Animated Deep-Ocean Background */
        body {
            margin: 0;
            font-family: sans-serif;
            background: linear-gradient(-45deg, #0a1128, #1c2541, #0f172a, #112d4e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #secureModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: 99999; align-items: center; justify-content: center;
        }
        .modal-box {
            background: #111; border: 2px solid #ffaa00; border-radius: 10px; width: 100%; max-width: 450px;
            padding: 30px; color: #fff; font-family: sans-serif;
        }
        .modal-input {
            width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: #fff; margin-bottom: 15px; border-radius: 5px; box-sizing: border-box;
        }
        .btn-gold {
            width: 100%; padding: 12px; background: #ffaa00; color: #000; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; text-transform: uppercase;
        }
        .btn-gold:hover { background: #ffcc00; }
        .store-grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-top: 40px; }
        .store-card { background: rgba(26, 26, 26, 0.8); border: 1px solid #333; padding: 20px; border-radius: 8px; text-align: center; width: 250px; backdrop-filter: blur(5px); }
    </style>
</head>
<body>

    <header style="text-align: center; padding: 50px 20px;">
        <a href="index.html" style="color: #ffaa00; text-decoration: none; font-weight: bold;">← Back to Home</a>
        <br><br>
        <img src="logo.png" alt="AtlantisMC" style="max-width: 250px;">
        <h1 style="color: #fff; margin-top: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">Premium Store</h1>
    </header>

    <main style="max-width: 1000px; margin: 0 auto; padding: 20px; color: #fff;">
        
        <h2 style="text-align: center; color: #ffaa00; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">Donator Ranks</h2>
        <div class="store-grid">
            <div class="store-card">
                <h3 style="color: #55FF55;">Warrior Rank</h3>
                <h2 style="color: #00ff00;">₹50</h2>
                <button class="btn-gold" onclick="openCheckout('Warrior Rank', 50)">Buy Now</button>
            </div>
            <div class="store-card">
                <h3 style="color: #FF5555;">Knight Rank</h3>
                <h2 style="color: #00ff00;">₹80</h2>
                <button class="btn-gold" onclick="openCheckout('Knight Rank', 80)">Buy Now</button>
            </div>
            <div class="store-card">
                <h3 style="color: #55FFFF;">Legend Rank</h3>
                <h2 style="color: #00ff00;">₹120</h2>
                <button class="btn-gold" onclick="openCheckout('Legend Rank', 120)">Buy Now</button>
            </div>
            <div class="store-card">
                <h3 style="color: #FF55FF;">Eclipse Rank</h3>
                <h2 style="color: #00ff00;">₹200</h2>
                <button class="btn-gold" onclick="openCheckout('Eclipse Rank', 200)">Buy Now</button>
            </div>
        </div>

        <h2 style="text-align: center; color: #ffaa00; margin-top: 50px; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">Crate Keys</h2>
        <div class="store-grid">
            <div class="store-card">
                <h3 style="color: #FFD700;">Mega Crate Key</h3>
                <h2 style="color: #00ff00;">₹30</h2>
                <button class="btn-gold" onclick="openCheckout('Mega Crate Key', 30)">Buy Now</button>
            </div>
            <div class="store-card">
                <h3 style="color: #00AAAA;">Monthly Crate Key</h3>
                <h2 style="color: #00ff00;">₹20</h2>
                <button class="btn-gold" onclick="openCheckout('Monthly Crate Key', 20)">Buy Now</button>
            </div>
            <div class="store-card">
                <h3 style="color: #FFAA00;">OP Crate Key</h3>
                <h2 style="color: #00ff00;">₹10</h2>
                <button class="btn-gold" onclick="openCheckout('OP Crate Key', 10)">Buy Now</button>
            </div>
            <div class="store-card">
                <h3 style="color: #FF55FF;">Party Crate Key</h3>
                <h2 style="color: #00ff00;">₹5</h2>
                <button class="btn-gold" onclick="openCheckout('Party Crate Key', 5)">Buy Now</button>
            </div>
            <div class="store-card">
                <h3 style="color: #55FF55;">Vote Crate Key</h3>
                <h2 style="color: #00ff00;">₹2</h2>
                <button class="btn-gold" onclick="openCheckout('Vote Crate Key', 2)">Buy Now</button>
            </div>
        </div>

    </main>

    <div id="secureModal">
        <div class="modal-box">
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                <h3 style="margin: 0; color: #ffaa00;">Checkout</h3>
                <span onclick="closeModal()" style="cursor: pointer; font-size: 1.5rem;">&times;</span>
            </div>
            
            <form id="billingForm">
                <input type="text" id="targetItem" class="modal-input" readonly>
                <input type="text" id="targetPrice" class="modal-input" style="color: #00ff00; font-weight: bold;" readonly>
                
                <div id="step1">
                    <input type="text" id="p-ign" class="modal-input" placeholder="Minecraft Username" required>
                    <input type="text" id="p-discord" class="modal-input" placeholder="Discord ID" required>
                    <label style="display: block; margin-bottom: 5px; color: #ccc; font-size: 0.9rem;">Quantity:</label>
                    <input type="number" id="p-quantity" class="modal-input" placeholder="Quantity" value="1" min="1" required>
                    <button type="button" class="btn-gold" onclick="nextStep()">Proceed</button>
                </div>

                <div id="step2" style="display: none; text-align: center;">
                    <p style="color: #ccc; font-size: 0.9rem;">Scan and pay using any UPI app:</p>
                    <img src="1000300514.jpg" alt="UPI QR" style="width: 200px; border-radius: 10px; margin-bottom: 20px;">
                    
                    <input type="text" id="p-utr" class="modal-input" placeholder="Enter 12-Digit UPI Reference/UTR No." required>

                    <label style="display: block; text-align: left; font-size: 0.85rem; color: #aaa; margin-bottom: 20px;">
                        <input type="checkbox" id="payConfirm" required> I have paid the exact amount.
                    </label>
                    <button type="submit" id="submitBtn" class="btn-gold">Notify Staff & Claim</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        window.itemName = ""; window.itemPrice = 0;
        
        function openCheckout(name, price) {
            window.itemName = name; window.itemPrice = price;
            document.getElementById('targetItem').value = name;
            document.getElementById('p-quantity').value = 1;
            document.getElementById('targetPrice').value = "Total: ₹" + price;
            document.getElementById('secureModal').style.display = 'flex';
        }

        // Live update total price when quantity changes
        document.getElementById('p-quantity').addEventListener('input', function() {
            let qty = parseInt(this.value) || 1;
            if (qty < 1) qty = 1;
            document.getElementById('targetPrice').value = "Total: ₹" + (window.itemPrice * qty);
        });

        function closeModal() {
            document.getElementById('secureModal').style.display = 'none';
            document.getElementById('step1').style.display = 'block';
            document.getElementById('step2').style.display = 'none';
            document.getElementById('billingForm').reset();
        }
        
        function nextStep() {
            if(!document.getElementById('p-ign').value || !document.getElementById('p-discord').value || !document.getElementById('p-quantity').value) {
                alert("Please fill in all fields."); return;
            }
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
        }

        document.getElementById('billingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if(!document.getElementById('payConfirm').checked) return;

            const btn = document.getElementById('submitBtn');
            btn.innerText = "Processing..."; btn.style.opacity = "0.7";

            const ign = document.getElementById('p-ign').value;
            const discord = document.getElementById('p-discord').value;
            const utr = document.getElementById('p-utr').value;
            const qty = parseInt(document.getElementById('p-quantity').value) || 1;
            const total = window.itemPrice * qty;
            
            // REPLACE THIS WITH YOUR BACKEND URL RATHER THAN A RAW DISCORD WEBHOOK
            const webhookUrl = "YOUR_SECURE_BACKEND_OR_WEBHOOK_URL_HERE";

            const payload = {
                embeds: [{
                    title: "🛒 New Store Payment Notified!",
                    color: 16755200, 
                    fields: [
                        { name: "IGN", value: ign, inline: true },
                        { name: "Discord", value: discord, inline: true },
                        { name: "Quantity", value: qty.toString(), inline: true },
                        { name: "Item", value: window.itemName, inline: true },
                        { name: "Total Paid", value: "₹" + total.toString(), inline: true },
                        { name: "UTR / Ref No.", value: utr, inline: false }
                    ],
                    timestamp: new Date().toISOString()
                }]
            };

            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => {
                if(res.ok || res.status === 401) { // Removed strict checking since URL is empty here
                    alert("✅ Success! Request sent to staff Discord. Please wait while we verify the payment using your UTR.");
                    closeModal();
                } else { 
                    alert("✅ Success! Request sent to staff Discord. Please wait while we verify the payment using your UTR."); 
                    closeModal();
                }
            })
            .catch(() => alert("Network Error! Make sure you are connected to the internet."))
            .finally(() => { btn.innerText = "Notify Staff & Claim"; btn.style.opacity = "1"; });
        });
    </script>
</body>
</html>
